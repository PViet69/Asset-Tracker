[project]
name = "openai-file-embeddings"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic-settings>=2.6.0",
    "python-magic>=0.4.27",
    "Pillow>=11.0.0",
    "pypdf>=5.1.0",
    "openai>=1.54.0",
    "qdrant-client>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.setuptools.packages.find]
include = ["backend*", "backend.app*"]

[tool.ruff.lint]
select = ["E", "F", "I"]
